<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ParkPredict IoT Smart Parking System Architecture</title>
  <desc id="desc">A clear workflow showing a driver searching for parking, RC522 readers identifying toy-car tags at individual bays, ESP32 sending readings by WebSocket to the FastAPI gateway, and occupancy updates returned to the Leaflet app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eef5f3"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e9f8a"/><stop offset="1" stop-color="#087c78"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#142b45" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62758a"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e9f8a"/></marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8393a5"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172b45}
      .title{font-size:34px;font-weight:750;letter-spacing:-.6px}
      .subtitle{font-size:16px;fill:#607287}
      .section{font-size:14px;font-weight:750;letter-spacing:1.4px;fill:#527064}
      .cardTitle{font-size:17px;font-weight:700}
      .body{font-size:14px;fill:#596d82}
      .small{font-size:12px;fill:#65798d}
      .step{font-size:12px;font-weight:750;fill:#fff}
      .label{font-size:13px;font-weight:650;fill:#53677c}
      .card{fill:#fff;stroke:#dce5ed;stroke-width:1.2}
      .line{fill:none;stroke:#62758a;stroke-width:2.4;marker-end:url(#arrow)}
      .lineTeal{fill:none;stroke:#0e9f8a;stroke-width:2.7;marker-end:url(#arrowTeal)}
      .optional{fill:none;stroke:#8393a5;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrowDashed)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1500" cy="70" r="145" fill="#dff3ee" opacity=".55"/>
  <circle cx="35" cy="1000" r="170" fill="#e2ebf7" opacity=".45"/>

  <text x="64" y="67" class="title">ParkPredict</text>
  <text x="64" y="101" class="subtitle">IoT smart parking · from destination search to live bay recommendations</text>
  <g transform="translate(1320 47)"><rect width="214" height="34" rx="17" fill="#e7f5f1" stroke="#c7e8df"/><circle cx="18" cy="17" r="5" fill="#0e9f8a"/><text x="32" y="22" class="small" style="font-weight:700;fill:#087c78">ESP32 + RFID TAG PER BAY</text></g>

  <rect x="48" y="132" width="1504" height="320" rx="22" fill="#fff" opacity=".7" stroke="#e4ebf1"/>
  <text x="76" y="166" class="section">A · DRIVER SEARCH FLOW</text>
  <text x="1522" y="166" class="small" text-anchor="end">Solid arrows = main system flow</text>

  <!-- Driver search cards -->
  <g filter="url(#shadow)">
    <rect x="75" y="194" width="205" height="205" rx="18" class="card"/>
    <rect x="305" y="194" width="218" height="205" rx="18" class="card"/>
    <rect x="548" y="194" width="220" height="205" rx="18" class="card"/>
    <rect x="793" y="194" width="232" height="205" rx="18" class="card"/>
    <rect x="1050" y="194" width="225" height="205" rx="18" class="card"/>
    <rect x="1300" y="194" width="225" height="205" rx="18" class="card"/>
  </g>
  <path d="M281 297H299" class="line"/><path d="M524 297H542" class="line"/><path d="M769 297H787" class="line"/><path d="M1026 297H1044" class="line"/><path d="M1276 297H1294" class="line"/>
  <g>
    <circle cx="98" cy="218" r="14" fill="#0e9f8a"/><text x="98" y="222" text-anchor="middle" class="step">1</text>
    <text x="121" y="224" class="cardTitle">Driver</text>
    <text x="96" y="267" class="body"><tspan x="96">Searches a destination</tspan><tspan x="96" dy="22">and selects vehicle needs.</tspan></text>
    <rect x="96" y="333" width="161" height="38" rx="10" fill="#f2f7f8"/><text x="108" y="357" class="small">Example: “Dmart”</text>

    <circle cx="328" cy="218" r="14" fill="#0e9f8a"/><text x="328" y="222" text-anchor="middle" class="step">2</text>
    <text x="351" y="224" class="cardTitle">React + Leaflet</text>
    <text x="326" y="267" class="body"><tspan x="326">Sends search and optional</tspan><tspan x="326" dy="22">GPS location to backend.</tspan></text>
    <rect x="326" y="333" width="174" height="38" rx="10" fill="#f2f7f8"/><text x="338" y="357" class="small">GPS sharing is optional</text>

    <circle cx="571" cy="218" r="14" fill="#0e9f8a"/><text x="571" y="222" text-anchor="middle" class="step">3</text>
    <text x="594" y="224" class="cardTitle">FastAPI backend</text>
    <text x="569" y="267" class="body"><tspan x="569">Coordinates search, parking</tspan><tspan x="569" dy="22">data, live status and results.</tspan></text>
    <rect x="569" y="333" width="178" height="38" rx="10" fill="#f2f7f8"/><text x="581" y="357" class="small">One service for the app</text>

    <circle cx="816" cy="218" r="14" fill="#0e9f8a"/><text x="816" y="222" text-anchor="middle" class="step">4</text>
    <text x="839" y="224" class="cardTitle">Find nearby parking</text>
    <text x="814" y="267" class="body"><tspan x="814">OpenStreetMap + verified</tspan><tspan x="814" dy="22">facilities; geocode destination.</tspan><tspan x="814" dy="22">Calculate walk from entrances.</tspan></text>
    <rect x="814" y="345" width="190" height="30" rx="9" fill="#eaf6f2"/><text x="826" y="365" class="small" style="font-weight:700;fill:#087c78">500 m walk · expandable</text>

    <circle cx="1073" cy="218" r="14" fill="#0e9f8a"/><text x="1073" y="222" text-anchor="middle" class="step">5</text>
    <text x="1096" y="224" class="cardTitle">Recommend</text>
    <text x="1071" y="267" class="body"><tspan x="1071">Filter by vehicle and rules.</tspan><tspan x="1071" dy="22">Use latest sensor state,</tspan><tspan x="1071" dy="22">walking distance and price.</tspan></text>
    <rect x="1071" y="345" width="183" height="30" rx="9" fill="#f2f7f8"/><text x="1083" y="365" class="small">Own lot first, then nearby</text>

    <circle cx="1323" cy="218" r="14" fill="#0e9f8a"/><text x="1323" y="222" text-anchor="middle" class="step">6</text>
    <text x="1346" y="224" class="cardTitle">Show results</text>
    <text x="1321" y="267" class="body"><tspan x="1321">Map markers + parking cards</tspan><tspan x="1321" dy="22">show bay state and freshness.</tspan></text>
    <rect x="1321" y="333" width="182" height="38" rx="10" fill="#eaf6f2"/><text x="1333" y="357" class="small" style="font-weight:700;fill:#087c78">Route + walking time</text>
  </g>

  <rect x="48" y="477" width="1504" height="290" rx="22" fill="#eaf5f2" stroke="#d5eae4"/>
  <text x="76" y="512" class="section">B · LIVE BAY STATUS FROM IoT SENSORS</text>
  <text x="1522" y="512" class="small" text-anchor="end">One RC522 reader is mapped to each bay</text>

  <g filter="url(#shadow)">
    <rect x="75" y="542" width="255" height="150" rx="17" class="card"/>
    <rect x="374" y="542" width="245" height="150" rx="17" class="card"/>
    <rect x="663" y="542" width="225" height="150" rx="17" class="card"/>
    <rect x="932" y="542" width="260" height="150" rx="17" class="card"/>
    <rect x="1237" y="542" width="288" height="150" rx="17" class="card"/>
  </g>
  <path d="M331 617H367" class="lineTeal"/><path d="M620 617H656" class="lineTeal"/><path d="M889 617H925" class="lineTeal"/><path d="M1193 617H1230" class="lineTeal"/>
  <g>
    <text x="98" y="578" class="cardTitle">RC522 RFID reader</text>
    <text x="98" y="609" class="body"><tspan x="98">Reads an RFID tag</tspan><tspan x="98" dy="21">close to the reader.</tspan></text>
    <text x="98" y="668" class="small">Allowlisted toy-car UID</text>

    <text x="397" y="578" class="cardTitle">ESP32 controller</text>
    <text x="397" y="609" class="body"><tspan x="397">Filters readings; maps the</tspan><tspan x="397" dy="21">device to its bay ID.</tspan></text>
    <text x="397" y="668" class="small">Occupied · Empty · Uncertain</text>

    <text x="686" y="578" class="cardTitle">Wi-Fi + WebSocket</text>
    <text x="686" y="609" class="body"><tspan x="686">Sends bay state, tag UID,</tspan><tspan x="686" dy="21">and device ID.</tspan></text>
    <text x="686" y="668" class="small">Authenticated device messages</text>

    <text x="955" y="578" class="cardTitle">FastAPI IoT service</text>
    <text x="955" y="609" class="body"><tspan x="955">Authenticates device; maps</tspan><tspan x="955" dy="21">tag UID to safe display label.</tspan></text>
    <text x="955" y="668" class="small">Updates current bay status</text>

    <text x="1260" y="578" class="cardTitle">In-memory state</text>
    <text x="1260" y="609" class="body"><tspan x="1260">Keeps latest bay state;</tspan><tspan x="1260" dy="21">resets on gateway restart.</tspan></text>
    <text x="1260" y="668" class="small">Latest state feeds recommendations</text>
  </g>

  <!-- Sensor status to recommendation -->
  <path d="M1380 541V449H1163V407" class="lineTeal"/>
  <rect x="1174" y="425" width="173" height="29" rx="14" fill="#d9f1e9" stroke="#bfe5d9"/>
  <text x="1260" y="444" text-anchor="middle" class="small" style="font-weight:700;fill:#087c78">Latest bay readings</text>

  <rect x="48" y="792" width="915" height="247" rx="22" fill="#fff" stroke="#e1e8ee"/>
  <text x="76" y="827" class="section">C · CURRENT HEURISTIC AVAILABILITY FORECAST</text>
  <rect x="77" y="861" width="248" height="118" rx="16" fill="#f6f8fb" stroke="#dfe6ed"/>
  <rect x="380" y="861" width="254" height="118" rx="16" fill="#f6f8fb" stroke="#dfe6ed"/>
  <rect x="689" y="861" width="242" height="118" rx="16" fill="#f6f8fb" stroke="#dfe6ed"/>
  <path d="M326 920H372" class="optional"/><path d="M635 920H681" class="optional"/>
  <text x="99" y="894" class="cardTitle">Current sensor count</text>
  <text x="99" y="922" class="body"><tspan x="99">Latest bay readings +</tspan><tspan x="99" dy="20">time-of-day curve</tspan></text>
  <text x="402" y="894" class="cardTitle">Rule-based time curve</text>
  <text x="402" y="922" class="body"><tspan x="402">Estimates available-bay</tspan><tspan x="402" dy="20">count for the arrival time</tspan></text>
  <text x="711" y="894" class="cardTitle">Forecast shown in app</text>
  <text x="711" y="922" class="body"><tspan x="711">Forecast is illustrative;</tspan><tspan x="711" dy="20">not trained on live history</tspan></text>

  <rect x="988" y="792" width="564" height="247" rx="22" fill="#fff" stroke="#e1e8ee"/>
  <text x="1016" y="827" class="section">STATUS AND BOOKING RULES</text>
  <g>
    <rect x="1017" y="852" width="225" height="36" rx="10" fill="#e5f6ef"/><circle cx="1035" cy="870" r="5" fill="#15966f"/><text x="1048" y="875" class="small" style="font-weight:700;fill:#197653">Sensor reports empty</text>
    <rect x="1255" y="852" width="264" height="36" rx="10" fill="#fff3df"/><circle cx="1273" cy="870" r="5" fill="#de9b27"/><text x="1286" y="875" class="small" style="font-weight:700;fill:#8d651d">Uncertain / Stale / Unknown</text>
    <text x="1017" y="920" class="body"><tspan x="1017">Sensor status shows occupancy. Operator inventory</tspan><tspan x="1017" dy="21">is required to confirm a reservation or booking.</tspan></text>
    <path d="M1017 972H1519" stroke="#e7edf1"/>
    <text x="1017" y="1004" class="small" style="font-weight:700">No connected sensor → Availability unknown</text>
  </g>

  <g transform="translate(66 1071)">
    <path d="M0 0H54" class="line"/><text x="67" y="5" class="small">Live search / sensor data</text>
    <path d="M278 0H332" class="optional"/><text x="345" y="5" class="small">Optional forecast / operator booking</text>
    <text x="1515" y="5" text-anchor="end" class="small" style="font-weight:700;fill:#40556b">React + Leaflet · FastAPI WebSocket · in-memory state · ESP32 + RC522</text>
  </g>
</svg>
